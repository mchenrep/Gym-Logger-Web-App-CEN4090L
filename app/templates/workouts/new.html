{% extends "base.html" %}

{% block title %}Start Workout - Gym Logger{% endblock %}

{% block content %}
<div class="card">
    <h2>Start a workout</h2>
    <form method="POST" class="stacked-form">
        <label>Template (optional)
            <select name="template_id">
                <option value="">No template (empty workout)</option>
                {% for template in templates %}
                    <option value="{{ template.id }}">{{ template.name }}</option>
                {% endfor %}
            </select>
        </label>
        <button type="submit">Start workout</button>
    </form>
    {% if templates %}
        <p><a href="{{ url_for('workout_templates.list_templates') }}">Manage my templates</a></p>
    {% else %}
        <p>No templates yet? <a href="{{ url_for('workout_templates.new_template') }}">Create one</a> to reuse your routine.</p>
    {% endif %}
</div>
{% endblock %}
