{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}
{% block content %}
<div class="card">
    <h2>Create your account</h2>
    <form method="POST" class="stacked-form">
        <label>Username <input type="text" name="username" value="{{ username }}" required></label>
        <label>Email <input type="email" name="email" value="{{ email }}" required></label>
        <label>Password (8+ characters) <input type="password" name="password" required></label>
        <label>Confirm password <input type="password" name="confirm_password" required></label>
        <button type="submit">Sign up</button>
    </form>
    <p>Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div>
{% endblock %}
